<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-DDoS Secure Portal - Dstat</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <div id="particles-container"></div>

    <div class="dstat-panel">
        <div class="dstat-header">LIVE TRAFFIC MONITOR</div>
        <div class="dstat-stats">
            <div class="stat-box">
                <span class="stat-label">Tổng Request</span>
                <span class="stat-value" id="dstat-total">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Req / Giây (RPS)</span>
                <span class="stat-value" id="dstat-rps">0</span>
            </div>
            <div class="stat-box error-box">
                <span class="stat-label">Truy cập lỗi/Chặn</span>
                <span class="stat-value" id="dstat-errors">0</span>
            </div>
        </div>
    </div>

    <div class="secure-card-wrapper">
        <div class="secure-card-inner">
            <h2>Hệ Thống Bảo Mật</h2>
            <p>Vui lòng xác thực để tiếp tục</p>
            <input type="text" class="cool-input" placeholder="Nhập mã truy cập...">
            <button class="cool-button" id="verify-btn">Gửi Request</button>
        </div>
    </div>

    <script src="security_modules/fixattack1.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
