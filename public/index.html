<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDoS Layer 7 Dashboard</title>
    <link rel="stylesheet" href="/public/style.css">
</head>
<body>

    <canvas id="particles"></canvas>

    <div class="dashboard-card">
        <h1>Bảng Điều Khiển</h1>
        <p>Hệ thống chống DDoS Layer 7</p>
        
        <div class="stat-box">
            <div style="font-size: 12px; color: #aaa;">TRẠNG THÁI HỆ THỐNG</div>
            <div class="stat-value">ĐANG BẢO VỆ</div>
        </div>

        <button onclick="alert('Đã tải lại module chống DDoS từ fixattack1.py!')">Cập nhật Firewall</button>
    </div>

    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        const numberOfParticles = 100;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1; 
                this.speedY = Math.random() * 2 + 0.5; 
                this.color = 'rgba(255, 255, 255, 0.8)';
            }
            update() {
                this.y += this.speedY;
                if (this.y > canvas.height) {
                    this.y = 0 - this.size;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();

        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });
    </script>
</body>
</html>
